<!DOCTYPE html>
<html xmlns="https://www.w3.org/1999/xhtml">

<head data-include="header">

</head>

<body>
    <section data-include="menu"></section>
    <section>
        <div class="container">
            <div class="row">
                <div class="col-12">
                    <h1 class="text-center fw-bold">
                        <span class="text-danger">AntSoft DS</span> • <span class="small">
                            Buscador de DOI's no CrossRef
                        </span>
                    </h1>
                    <hr class="w-100 bg-danger" />
                </div>
                <div class="col-12">
                    <div class="card">
                        <div class="card-header bg-dark text-white">
                            <h3 class="card-title fw-bold">Formulário de Busca</h3>
                        </div>
                        <div class="card-body">
                            <div class="row">
                                <div class="col-lg-6 col-sm-12">
                                    <label class="fw-bold">
                                        Termo a ser localizado no CrossRef
                                        <sup>
                                            <a class="superscript text-danger" href="#" data-bs-toggle="popover"
                                                data-bs-trigger="focus" title="Ajuda"
                                                data-bs-content="Os dados informados no termo a ser pesquisado, deve ser compatível com as opções de busca ao lado">
                                                <i class="fa fa-question-circle"></i>
                                            </a>
                                        </sup>
                                    </label>
                                    <input type="text" class="form-control" id="strDOI">
                                    <label>
                                        Ordenação: <sup>
                                            <a class="superscript text-danger" href="#" data-bs-toggle="popover"
                                                data-bs-trigger="focus" title="Ajuda"
                                                data-bs-content="Você pode ordenar os resultados de acordo com as opções abaixo!">
                                                <i class="fa fa-question-circle"></i>
                                            </a>
                                        </sup>
                                    </label>
                                    <select id="ddlOrder" class="form-select">
                                        <option selected value="0">Relevância</option>
                                        <option value="1">Data Atualização</option>
                                        <option value="2">Data Depósito</option>
                                        <option value="3">Data Publicação</option>
                                        <option value="4">Número do volume</option>
                                        <option value="5">Data da publicação impressa</option>
                                        <option value="6">Data da publicação online</option>
                                    </select>
                                    <input type="radio" class="radio" value="0" name="rbOrder" checked />
                                    <label for="orderAsc" class="mr-3">Crescente</label>
                                    <input type="radio" class="radio" value="1" name="rbOrder" />
                                    <label for="orderDesc" class="mr-3">Decrescente</label>
                                </div>
                                <div class="col-lg-6 col-sm-12">
                                    <label class="d-block fw-bold">
                                        Opções de Busca
                                        <sup>
                                            <a class=" superscript text-danger" href="#" data-bs-toggle="popover"
                                                data-bs-trigger="focus" title="Ajuda"
                                                data-bs-content="Cada opção permite um tipo de busca diferente">
                                                <i class="fa fa-question-circle"></i>
                                            </a>
                                        </sup>
                                    </label>
                                    <fieldset id="DOIOption">
                                        <input type="radio" id="prefReg" class="radio" value="0" name="DOIOption"
                                            checked />
                                        <label for="prefReg" class="mr-3">Prefixo DOI</label>

                                        <input type="radio" id="doiArt" class="radio" value="1" name="DOIOption" />
                                        <label for="doiArt" class="mr-3">DOI do artigo</label>

                                        <input type="radio" id="doiTitle" class="radio" value="2" name="DOIOption" />
                                        <label for="doiTitle" class="mr-3">Título</label>

                                        <input type="radio" id="doiAuthor" class="radio" value="4" name="DOIOption" />
                                        <label for="doiAuthor" class="mr-3">Autor(es)</label>

                                        <input type="radio" id="doiISSN" class="radio" value="3" name="DOIOption" />
                                        <label for="doiISSN" class="mr-3">ISSN</label>

                                        <label for="ddlRow" class="mr-3">
                                            Itens por busca<sup>
                                                <a class="superscript text-danger" href="#" data-bs-toggle="popover"
                                                    data-bs-trigger="focus" title="Ajuda"
                                                    data-bs-content="Você limitar ou expandir o número de resultados a serem exibidos">
                                                    <i class="fa fa-question-circle"></i>
                                                </a>
                                            </sup>
                                        </label>
                                        <select class="form-select" id="ddlRows">
                                            <option value="20">20 items</option>
                                            <option value="40">40 items</option>
                                            <option value="100" selected>100 items</option>
                                            <option value="200">200 items (lento)</option>
                                            <option value="500">500 items (muito lento)</option>
                                            <option value="1000">1000 items (muito demorado)</option>

                                        </select>
                                    </fieldset>
                                </div>
                            </div>
                        </div>
                        <div class="card-footer text-center">
                            <button id="btnSearch" class="btn btn-dark m-2">Pesquisar</button>
                        </div>
                    </div>
                </div>
                <div class="col-12">
                    <span id="status"></span>
                    <span id="loading" class="text-danger"></span>
                    <span id="count"></span>
                    <p class="main" id="dois"></p>

                </div>
            </div>
        </div>
    </section>

    <hr class="w-100" />
    <div class="container-fluid footer">
        <div class="row">
            <div class="col-6">
                <div id="credit"></div>
                <div class="text-center small">
                    <a rel="license" href="https://creativecommons.org/licenses/by/4.0/" target="_blank">
                        <img alt="Licença Creative Commons" style="border-width:0"
                            src="https://i.creativecommons.org/l/by/4.0/88x31.png" />
                    </a><br />Este obra está licenciado
                    com uma Licença <a rel="license" href="http://creativecommons.org/licenses/by/4.0/"
                        target="_blank">Creative Commons Atribuição 4.0 Internacional</a>.
                </div>
            </div>
            <div class="col-6">
                <span id="version"></span>
                <p class="text-center">
                    Este sistema usa <a href="https://github.com/CrossRef/rest-api-doc" target="_blank">
                        API do CrossRef</a>, extraíndo os dados diretamente da base de dados original.
                </p>
            </div>

        </div>
    </div>
    <div class="scroll-top-wrapper">
        <span class="scroll-top-inner">
            <i class="fa fa-arrow-up"></i>
            <br />
            Topo
        </span>
    </div>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jquery/3.7.1/jquery.min.js"
        integrity="sha512-v2CJ7UaYy4JwqLDIrZUI/4hqeoQieOmAZNXBeQyjo21dadnwR+8ZaIJVT8EE2iyI61OV8e6M8PP2/4hpQINQ/g=="
        crossorigin="anonymous" referrerpolicy="no-referrer"></script>
    <script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.11.8/dist/umd/popper.min.js"
        integrity="sha384-I7E8VVD/ismYTF4hNIPjVp/Zjvgyol6VFvRkX/vR+Vc4jQkC+hVqc2pM8ODewa9r"
        crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.min.js"
        integrity="sha384-G/EV+4j2dNv+tEPo3++6LCgdCROaejBqfUeNjuKAiuXbjrxilcCdDz6ZAVfHWe1Y"
        crossorigin="anonymous"></script>
    <script>
        //ativa o popover
        const popoverTriggerList = document.querySelectorAll('[data-bs-toggle="popover"]')
        const popoverList = [...popoverTriggerList].map(popoverTriggerEl => new bootstrap.Popover(popoverTriggerEl))
    </script>

    
    <script src="js/scrollreveal.min.js"></script>
    <script src="js/appinfo.js"></script>
    <script src="js/credits.js"></script>
    <script>
        $("#strDOI").keyup(function (e) {
            if (e.which === 13) {
                $("#btnSearch").click();
            };
        });
        $("#btnSearch").click(function () {
            console.log('Start');
            var shtm = '';
            var id = 1;
            $("#status").html('');
            $("#dois").html('');
            $("#count").html('');
            $("#loading").show();
            $("#loading").html('<hr class="w-100 bg-danger"><h2>Aguarde carregando os registros...<i class="fa fa-spinner fa-lg fa-spin mr-2"></i></h2>');
            var sstr = $("#strDOI").val();
            if (!sstr) {
                $("#status").html("<div class='card card-body mt-2'><h2 class='text-warning fw-bold'>Um valor do DEVE ser Informado!</h2></div>");
                $("#loading").hide();
                return;
            }
            var opt = ""
            var opOrder = "";
            var radios = document.getElementsByName('DOIOption');
            var radioOrder = document.getElementsByName('rbOrder');
            for (var i = 0, length = radios.length; i < length; i++) {
                if (radios[i].checked) {
                    // do whatever you want with the checked radio
                    opt = radios[i].value;
                    break;
                }
            }
            if (opt == "0") {
                sstr = "filter=prefix:" + sstr
            } else if (opt == "1") {
                sstr = "filter=doi:" + sstr;
            } else if (opt == "2") {
                sstr = "query.bibliographic=" + sstr.replace("&", "%26");
            } else if (opt == "3") {
                sstr = "filter=issn:" + sstr;
            } else if (opt == "4") {
                sstr = "query.author=" + sstr;
            } else {
                $("#status").html("<div class='card card-body mt-2'><h2 class='text-warning fw-bold'>Uma opção deve ser selecionada!</h2></div>");
                $("#loading").hide();
                return;
            }
            var rows = "rows=" + $("#ddlRows").val();
            var isort = $("#ddlOrder").val();
            var ssort = "";

            if (isort == 0) {
                ssort = "sort=relevance"
            } else if (isort == 1) {
                ssort = "sort=updated"
            } else if (isort == 2) {
                ssort = "sort=deposited"
            } else if (isort == 3) {
                ssort = "sort=published"
            } else if (isort == 4) {
                ssort = "sort=issued"
            } else if (isort == 5) {
                ssort = "sort=published-print"
            } else if (isort == 6) {
                ssort = "sort=published-online"
            }

            for (var i = 0, length = radioOrder.length; i < length; i++) {
                if (radioOrder[i].checked) {
                    // do whatever you want with the checked radio
                    opOrder = radioOrder[i].value;
                    break;
                }
            }
            var ordem = "";
            if (opOrder == "0") {
                ordem = "order=asc"
            } else if (opOrder == "1") {
                ordem += "order=desc";
            } else {
                $("#status").html("<div class='card card-body mt-2'><h2 class='text-warning fw-bold'>Uma opção de ordenamento deve ser selecionada!</h2></div>");
                $("#loading").hide();
                return;
            }
            $.ajax({
                type: "GET",
                dataType: "json",
                url: "https://api.crossref.org/works?" + rows + "&" + sstr + "&" + ssort + "&" + ordem,
                success: function (data) {

                    matriz = data.message.items;
                    for (var i = 0; i < matriz.length; i++) {
                        id = i + 1;
                        shtm += "<span class='badge text-bg-primary mr-2'>" + id + "</span>"
                        shtm += "<span class='fw-bold ml-3'>Título: </span>" + matriz[i].title + "<br/>";
                        shtm += "<span class='fw-bold ml-3'>DOI: </span>" + matriz[i].DOI + "<br/>";

                        shtm += "<span class='fw-bold ml-3'>Revista: </span>" + matriz[i]['container-title'] + "<br/>";
                        shtm += "<span class='fw-bold ml-3'>Abreviação da Revista: </span>" + matriz[i]['short-container-title'] + "<br/>";
                        shtm += "<span class='fw-bold ml-3'>Volume e Número: v.</span>" + matriz[i]['volume'] + ".i" + matriz[i]['issue'] + "<br/>";
                        shtm += "<span class='fw-bold ml-3'>Tipo de Publicação: </span>" + matriz[i]['type'] + "<br/>";
                        shtm += "<span class='fw-bold ml-3'>Publisher: </span>" + matriz[i].publisher + "<br/>";
                        //for (var ii = 0; ii < matriz[i].link.length; ii++) {
                        //shtm += "URL Original: " + matriz[i]['link'] + "<br/>";
                        //}
                        if (opt !== "2" && opt !== "4") {
                            shtm += "<span class='fw-bold ml-3'>ISSN: </span>" + matriz[i]['ISSN'][0] + "<br/>";
                        }
                        shtm += "<span class='fw-bold ml-3'>URL DOI: </span><a href='" + matriz[i]['URL'] + "' target='_blank'>" + matriz[i]['URL'] + "</a><br/>";
                        shtm += '<div class="d-block"><a class="btn btn-primary " data-bs-toggle="collapse" href="#collapseExample' + id + '" role="button" aria-expanded="false" aria-controls="collapseExample' + id + '">Abstract</a></div>';
                        shtm += '<div class="collapse" id="collapseExample' + id + '"><div class="card card-body">';
                        shtm += matriz[i].abstract;
                        shtm += '</div></div>';
                        var date = new Date(matriz[i].created.timestamp);
                        shtm += "<span class='fw-bold ml-3'>Data do Depósito: </span>" + date.toLocaleDateString("pt-BR") + "<hr class='w-100 bg-primary'/>";
                    };
                    $("#dois").html('<hr class="w-100 text-primary rounded" style="height: 5px;"/>' + shtm);
                    $("#loading").hide();
                    $("#count").html('<h4 class="m-3 p-3 bg-light">Foi(ram) localizado(s) <span class="badge text-bg-danger">' + matriz.length + '</span> registro(s)</h4>');
                    $("#status").html('');
                },
                error: function (data) {
                    console.log(data);
                    $("#status").html('<hr class="w-100 text-primary rounded" style="height: 5px;""/><div class="card card-body p-3"><h2 class="text-warning">Erro ao carregar os DOIS!</h2><p class="lead">Verifique se os dados informados são compatíveis com a opção selecionada!</p></div>');
                    $("#dois").html('');
                    return;
                },
                complete: function () {
                    $("#loading").hide();
                    //
                    // $("#dois").html('');
                }
            });
            console.log('End');

        });
    </script>
    <script>

        $(document).ready(function () {
            $("#loading").hide();
            $("#count").html('');
            $("#status").html('');
        });
    </script>
    <script>
        $(document).ready(function () {
            AppInfo();
        })

    </script>

</body>

</html>
